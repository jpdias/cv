name: Build CV

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile main.tex
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build PDF
        uses: xu-cheng/texlive-action@v3
        with:
          run: make pdf

      - name: Report LaTeX errors
        if: failure()
        run: |
          if [ ! -f build/main.log ]; then
            echo "::error::no build/main.log was produced"
            exit 0
          fi
          {
            echo "### LaTeX log tail"
            echo '```'
            tail -60 build/main.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -nE '^!' build/main.log | head -5 | while IFS= read -r line; do
            echo "::error::$line"
          done
          tail -30 build/main.log | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Check citations were resolved by biber
        run: |
          if grep -nE "could not be found in the bibliography|undefined citation|Please \\\\(re\\\\)?run Biber" build/main.log; then
            echo "::error::unresolved bibliography entries in build/main.log"
            exit 1
          fi

      - name: Upload PDF
        uses: actions/upload-artifact@v6
        with:
          name: cv
          path: build/main.pdf