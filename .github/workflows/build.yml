name: Build CV

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REPO: jpdias/jpdias.github.io
  TARGET_BASE: master
  TARGET_PDF: assets/jpdias.pdf
  PUBLISH_BRANCH: ci/update-cv-pdf

jobs:
  build:
    name: Compile main.tex
    runs-on: ubuntu-latest
    # secrets is not available in a step-level `if`, so it is exposed through env.
    env:
      CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build PDF
        uses: xu-cheng/texlive-action@v3
        with:
          run: make pdf

      - name: Report LaTeX errors
        if: failure()
        run: |
          if [ ! -f build/main.log ]; then
            echo "::error::no build/main.log was produced"
            exit 0
          fi
          {
            echo "### LaTeX log tail"
            echo '```'
            tail -60 build/main.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -nE '^!' build/main.log | head -5 | while IFS= read -r line; do
            echo "::error::$line"
          done
          tail -30 build/main.log | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Check citations were resolved by biber
        run: |
          if grep -nE "could not be found in the bibliography|undefined citation|Please \\\\(re\\\\)?run Biber" build/main.log; then
            echo "::error::unresolved bibliography entries in build/main.log"
            exit 1
          fi

      - name: Upload PDF
        uses: actions/upload-artifact@v6
        with:
          name: cv
          path: build/main.pdf

      - name: Skip publishing
        if: ${{ failure() || env.CROSS_REPO_TOKEN == '' }}
        run: |
          echo "::notice::not publishing: build failed or secrets.CROSS_REPO_TOKEN is not set"

      - name: Open PR updating assets/jpdias.pdf
        if: ${{ success() && env.CROSS_REPO_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ env.CROSS_REPO_TOKEN }}
          TARGET_URL: https://x-access-token:${{ env.CROSS_REPO_TOKEN }}@github.com/${{ env.TARGET_REPO }}.git
        run: |
          set -euo pipefail

          # Clone the website repo so the PR contains only the PDF change.
          git clone --quiet --depth 1 --single-branch --branch "$TARGET_BASE" "$TARGET_URL" site
          cd site

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          cp ../build/main.pdf "$TARGET_PDF"

          if git diff --quiet -- "$TARGET_PDF"; then
            echo "$TARGET_PDF is identical to $TARGET_BASE, nothing to publish."
            exit 0
          fi

          git checkout -q -B "$PUBLISH_BRANCH"
          git add "$TARGET_PDF"
          git commit -q -m "Update $TARGET_PDF from jpdias/cv (${GITHUB_SHA:0:8})"
          git push --quiet --force origin "HEAD:refs/heads/$PUBLISH_BRANCH"

          number=$(gh pr list --repo "$TARGET_REPO" --head "$PUBLISH_BRANCH" \
            --state open --json number --jq '.[0].number // empty')

          if [ -n "$number" ]; then
            echo "PR #$number is already open: https://github.com/$TARGET_REPO/pull/$number"
          else
            gh pr create --repo "$TARGET_REPO" \
              --base "$TARGET_BASE" \
              --head "$PUBLISH_BRANCH" \
              --title "Update $TARGET_PDF from jpdias/cv" \
              --body "Automated rebuild of \`$TARGET_PDF\` from jpdias/cv@${GITHUB_SHA}."
          fi